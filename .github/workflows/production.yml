name: Deploy existing production services
on:
  workflow_dispatch:
    inputs:
      target:
        description: Service to deploy
        type: choice
        default: both
        options: [both, frontend, backend]
permissions: {}
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/master' && inputs.target != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy and verify the selected revision
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: python
        run: |
          import json, os, time, urllib.request
          from urllib.parse import urlsplit
          targets = [
              ("Render", "BACKEND_HOOK", {"api.render.com"}, "https://bet-builder-api-uxxb.onrender.com/release"),
          ]
          for name, key, hosts, _ in targets:
              url = urlsplit(os.getenv(key, ""))
              if url.scheme != "https" or url.hostname not in hosts:
                  raise SystemExit(f"Configure {key} for the existing {name} production project.")
          for name, key, _, endpoint in targets:
              try:
                  request = urllib.request.Request(os.environ[key], data=b"", method="POST")
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"{name} accepted deployment request ({response.status})", flush=True)
              except Exception:
                  raise SystemExit(f"{name} rejected its deploy hook. Check it in the hosting dashboard.") from None
              deadline = time.monotonic() + 480
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(endpoint + "?check=" + str(time.time_ns()), timeout=12) as response:
                          release = json.load(response)
                      if release.get("revision") == os.environ["GITHUB_SHA"]:
                          print(f"{name} serves the requested commit", flush=True)
                          if name == "Render":
                              for flag in ("grok_key_configured", "solana_signer_configured"):
                                  if not release.get(flag):
                                      print(f"::warning::{flag} is false on Render")
                          break
                  except (OSError, ValueError):
                      pass
                  time.sleep(10)
              else:
                  raise SystemExit(f"{name} did not serve the requested commit. Check build logs and the linked branch.")

  vercel:
    if: github.ref == 'refs/heads/master' && inputs.target != 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy the selected Git commit to the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        shell: python
        run: |
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM_ID"]
          if not token or not team:
              raise SystemExit("Set the VERCEL_TOKEN repository secret and VERCEL_TEAM_ID repository variable.")
          url = "https://api.vercel.com/v13/deployments?" + urllib.parse.urlencode({"teamId": team})
          payload = {"name": "bet-builder-frontend", "target": "production",
                     "gitSource": {"type": "github", "repoId": int(os.environ["GITHUB_REPOSITORY_ID"]),
                                   "ref": "master", "sha": os.environ["GITHUB_SHA"]}}
          request = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                           headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  deployment_id = json.load(response)["id"]
                  print("Vercel accepted deployment", deployment_id, flush=True)
              status_url = "https://api.vercel.com/v13/deployments/" + urllib.parse.quote(deployment_id, safe="") + "?" + urllib.parse.urlencode({"teamId": team})
              status_request = urllib.request.Request(status_url, headers={"Authorization": f"Bearer {token}"})
              for attempt in range(50):
                  with urllib.request.urlopen(status_request, timeout=20) as response:
                      deployment = json.load(response)
                  state = deployment["readyState"]
                  if state == "READY":
                      break
                  if state in ("ERROR", "CANCELED", "BLOCKED"):
                      reason = deployment.get("errorMessage") or deployment.get("errorCode") or "Check the project build logs."
                      raise SystemExit(f"Vercel deployment {deployment_id}: {state}: {reason}")
                  time.sleep(5)
              else:
                  raise SystemExit(f"Vercel deployment {deployment_id} did not finish building.")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Vercel rejected deployment (HTTP {error.code}). Check the team, token and Git integration.")
      - name: Verify the public frontend revision
        shell: bash
        run: |
          for attempt in {1..60}; do
            revision=$(curl -fsS --max-time 5 "https://bet-builder-frontend.vercel.app/api/release?check=$(date +%s)" | jq -r .revision) || revision=""
            if [[ "$revision" == "$GITHUB_SHA" ]]; then
              echo "Production serves $revision"
              exit 0
            fi
            sleep 8
          done
          echo "::error::Production did not report the selected commit. Check Vercel deployment logs."
          exit 1
